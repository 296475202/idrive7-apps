name: sync upstream and publish zh apps
# The fork's default branch holds only this automation. Every run resets the
# tree to upstream's main, copies zh-apps-kit/ in from the fork branch that
# triggered it, applies the patch and force-pushes the result as `zh-apps`.
#
# Nothing is built here: BMW's oap-sdk must be extracted from a head unit and
# must never be committed or shipped in a package, so the published branch is
# source only - exactly upstream's publishing model. The car pulls the branch,
# reads mgu-repo.json and builds every app on the unit, in Chinese (the patch
# puts --language zh-CN into the repo's build args).
#
# The car's source:
#   {"id": "idrive7-apps-zh", "type": "github",
#    "repo": "296475202/idrive7-apps", "channel": "branch:zh-apps"}
#
# Publishing appends one commit on top of the previous zh-apps tip and never
# force-pushes: the car's MGU STORE pulls this branch, and a rewritten history
# leaves it stranded on an old version. An unchanged tree is still skipped. The
# patch raises each app one patch above whichever is newer - upstream's version
# or the one already on zh-apps - so a fork-only fix also lands as a new number.
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-apps-zh
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reset to upstream's main, keep the kit
        run: |
          git fetch --depth 1 https://github.com/cauliflowermossgrape/idrive7-apps.git main
          git checkout -B zh-apps FETCH_HEAD
          git checkout "${{ github.sha }}" -- zh-apps-kit
          # The car reads only mgu-repo.json and apps/. The GITHUB_TOKEN of a
          # workflow run may not create or update a workflow file, so upstream's
          # CI files in this tree would make the push fail every time upstream
          # edits one of them. Pin .github/workflows to what zh-apps already
          # carries: the branch never needs upstream's CI, and the push then
          # only ever changes apps/, kit/ and zh-apps-kit/.
          if git fetch --depth 1 origin zh-apps 2>/dev/null; then
            rm -rf .github/workflows
            git checkout FETCH_HEAD -- .github/workflows || true
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch (credit, BM3 fallback, zh-CN build args, version bump)
        env:
          # The reset step fetched the current zh-apps last, so FETCH_HEAD is the
          # published side of the version bump (a fork-only fix must still get a
          # new number).
          ZH_PUBLISHED_REF: FETCH_HEAD
        run: python3 zh-apps-kit/patch.py
      - name: Sanity check the Chinese layer
        run: python3 kit/tools/test_zh.py
      - name: Publish the zh-apps branch
        run: |
          set -e
          upstream="$(git rev-parse --short HEAD)"
          git config user.name "zh apps bot"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          tree="$(git write-tree)"
          parent=""
          if git fetch --depth 1 origin zh-apps 2>/dev/null; then
            parent="$(git rev-parse FETCH_HEAD)"
            if [ "$tree" = "$(git rev-parse FETCH_HEAD^{tree})" ]; then
              echo "zh-apps unchanged for upstream $upstream; nothing pushed"
              exit 0
            fi
          fi
          # Commit on top of the published tip and push without --force. A
          # force-push rewrites the branch, so a car that pulls it can never
          # catch up again (that is how a head unit got stranded on an old
          # version). History here is only a chain of these commits; the tree is
          # upstream's head plus the patch either way.
          if [ -n "$parent" ]; then
            commit="$(git commit-tree "$tree" -p "$parent" -m "zh apps: upstream $upstream")"
          else
            commit="$(git commit-tree "$tree" -m "zh apps: upstream $upstream")"
          fi
          git push origin "$commit:refs/heads/zh-apps"
          echo "published zh-apps for upstream $upstream, tree $tree, commit $commit"
